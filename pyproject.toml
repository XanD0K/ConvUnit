[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "convunit"
version = "1.0.0"
description = "A flexible unit conversion tool with support for custom groups, types, aliases, and date/time conversions."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Alexandre D. Ferrari", email = "element_trading_47@icloud.com"}
]
requires-python = ">=3.9"
keywords = ["unit-conversion", "converter", "convunit", "cli", "api", "date-time"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]
dependencies = [
    "platformdirs>=4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/XanD0K/ConvUnit"
Repository = "https://github.com/XanD0K/ConvUnit"
Issues = "https://github.com/XanD0K/ConvUnit/issues"

[project.scripts]
convunit = "convunit.cli:cli_entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
convunit = ["data/*.json"]
